<svg xmlns="http://www.w3.org/2000/svg" width="580" height="340" viewBox="0 0 580 340" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Daytime ionospheric layers numbered 1 (lowest) to 4 (highest)</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111" stroke="none"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<rect x="60" y="300" width="460" height="24" fill="#d9c8a9" stroke="none"/><text x="290" y="317" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Earth</text><rect x="60" y="255" width="460" height="14" fill="#cfe0f5" stroke="#1a5fb4" stroke-width="1"/><text x="540" y="267.0" text-anchor="start" fill="#111" stroke="none" font-size="14" font-weight="bold">1</text><rect x="60" y="215" width="460" height="14" fill="#cfe0f5" stroke="#1a5fb4" stroke-width="1"/><text x="540" y="227.0" text-anchor="start" fill="#111" stroke="none" font-size="14" font-weight="bold">2</text><rect x="60" y="150" width="460" height="18" fill="#cfe0f5" stroke="#1a5fb4" stroke-width="1"/><text x="540" y="164.0" text-anchor="start" fill="#111" stroke="none" font-size="14" font-weight="bold">3</text><rect x="60" y="75" width="460" height="30" fill="#cfe0f5" stroke="#1a5fb4" stroke-width="1"/><text x="540" y="95.0" text-anchor="start" fill="#111" stroke="none" font-size="14" font-weight="bold">4</text><line x1="40" y1="320" x2="40" y2="30" /><text x="40" y="20" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="normal">height</text><text x="290" y="18" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="bold">Ionosphere in daytime (not to scale)</text>
</g>
</svg>
