<svg xmlns="http://www.w3.org/2000/svg" width="380" height="310" viewBox="0 0 380 310" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Three-element Yagi seen from above: element 1 longest, element 2 fed, element 3 shortest</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111" stroke="none"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<line x1="80" y1="60" x2="80" y2="260" /><line x1="200" y1="75" x2="200" y2="245" /><line x1="300" y1="90" x2="300" y2="230" /><line x1="40" y1="160" x2="340" y2="160" stroke="#888"/><text x="80" y="290" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="normal">1</text><text x="200" y="290" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="normal">2</text><text x="300" y="290" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="normal">3</text><circle cx="200" cy="160" r="3.5" fill="#111"/><text x="214" y="152" text-anchor="start" fill="#111" stroke="none" font-size="12" font-weight="normal">feed</text>
</g>
</svg>
