<svg xmlns="http://www.w3.org/2000/svg" width="680" height="150" viewBox="0 0 680 150" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>FM receiver stages: IF amplifier, block X, FM demodulator, AF amplifier</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111" stroke="none"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="60" width="120" height="60" rx="4" fill="#fff"/><text x="90.0" y="87.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">IF</text><text x="90.0" y="103.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">amplifier</text><rect x="190" y="60" width="120" height="60" rx="4" fill="#fff"/><text x="250.0" y="95.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="bold">X</text><line x1="150" y1="90.0" x2="190" y2="90.0" marker-end="url(#arr)"/><rect x="350" y="60" width="120" height="60" rx="4" fill="#fff"/><text x="410.0" y="87.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">FM</text><text x="410.0" y="103.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">demodulator</text><line x1="310" y1="90.0" x2="350" y2="90.0" marker-end="url(#arr)"/><rect x="510" y="60" width="120" height="60" rx="4" fill="#fff"/><text x="570.0" y="87.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">AF</text><text x="570.0" y="103.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">amplifier</text><line x1="470" y1="90.0" x2="510" y2="90.0" marker-end="url(#arr)"/>
</g>
</svg>
