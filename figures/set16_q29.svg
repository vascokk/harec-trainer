<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="80" width="120" height="54" rx="4" fill="#fff"/><text x="90.0" y="112.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Transmitter</text><rect x="230" y="80" width="120" height="54" rx="4" fill="#fff"/><text x="290.0" y="112.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">ATU</text><line x1="150" y1="107.0" x2="230" y2="107.0" marker-end="url(#arr)"/><line x1="380" y1="107" x2="640" y2="107" /><text x="520" y="97" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="normal">feeder</text><line x1="640" y1="107" x2="640" y2="73" /><line x1="640" y1="73" x2="629" y2="57" /><line x1="640" y1="73" x2="651" y2="57" /><line x1="640" y1="73" x2="640" y2="57" /><circle cx="190" cy="107" r="14" fill="#fff" stroke-dasharray="4,3"/><text x="190" y="112" text-anchor="middle" fill="#111" stroke="none" font-size="12" font-weight="bold">P1</text><circle cx="430" cy="107" r="14" fill="#fff" stroke-dasharray="4,3"/><text x="430" y="112" text-anchor="middle" fill="#111" stroke="none" font-size="12" font-weight="bold">P2</text>
</g>
</svg>
