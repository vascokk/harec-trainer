<svg xmlns="http://www.w3.org/2000/svg" width="700" height="180" viewBox="0 0 700 180" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Possible SWR meter positions P1 (transmitter to ATU) and P2 (ATU to feeder)</title>
