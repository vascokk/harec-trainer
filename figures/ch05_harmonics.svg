<svg xmlns="http://www.w3.org/2000/svg" width="620" height="270" viewBox="0 0 620 270" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Spectrum with lines at 7.1, 14.2 and 21.3 MHz, decreasing in size</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111" stroke="none"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<line x1="40" y1="230" x2="580" y2="230" marker-end="url(#arr)"/><line x1="40" y1="230" x2="40" y2="30" marker-end="url(#arr)"/><text x="580" y="252" text-anchor="end" fill="#111" stroke="none" font-size="13" font-weight="normal">frequency</text><text x="32" y="24" text-anchor="start" fill="#111" stroke="none" font-size="13" font-weight="normal">amplitude</text><line x1="148.0" y1="230" x2="148.0" y2="50.0" stroke="#1a5fb4" stroke-width="4"/><text x="148.0" y="252" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">7.1 MHz</text><line x1="256.0" y1="230" x2="256.0" y2="160.0" stroke="#1a5fb4" stroke-width="4"/><text x="256.0" y="252" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">14.2 MHz</text><line x1="364.0" y1="230" x2="364.0" y2="200.0" stroke="#1a5fb4" stroke-width="4"/><text x="364.0" y="252" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">21.3 MHz</text>
</g>
</svg>
