<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Two rays: A goes almost straight up through the ionosphere; B is returned to Earth</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111" stroke="none"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M20,300 Q350.0,250 680,300" stroke-width="3"/><path d="M20,95 Q350.0,40 680,95" stroke="#888" stroke-dasharray="10,6"/><text x="670" y="70" text-anchor="end" fill="#111" stroke="none" font-size="13" font-weight="normal">ionosphere</text><text x="350.0" y="300" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Earth</text><text x="350" y="290" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="bold">TX</text><path d="M350,270 L330,20" stroke="#c01c28" stroke-width="2.4" fill="none"/><text x="320" y="30" text-anchor="end" fill="#111" stroke="none" font-size="14" font-weight="bold">A</text><path d="M350,270 L560,64 L660,240" stroke="#1a5fb4" stroke-width="2.4" fill="none"/><text x="565" y="50" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="bold">B</text>
</g>
</svg>
