<svg xmlns="http://www.w3.org/2000/svg" width="400" height="290" viewBox="0 0 400 290" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Three-element Yagi: element 1 longest, element 2 fed, element 3 shortest</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111" stroke="none"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<line x1="60" y1="150" x2="340" y2="150" stroke-width="3"/><text x="200" y="24" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="bold">Plan view (from above)</text><line x1="100" y1="50" x2="100" y2="250" stroke-width="3.5"/><line x1="200" y1="60" x2="200" y2="144" stroke-width="3.5"/><line x1="200" y1="156" x2="200" y2="240" stroke-width="3.5"/><line x1="300" y1="70" x2="300" y2="230" stroke-width="3.5"/><text x="214" y="168" text-anchor="start" fill="#111" stroke="none" font-size="12" font-weight="normal">feed</text><text x="100" y="275" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="bold">1</text><text x="200" y="275" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="bold">2</text><text x="300" y="275" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="bold">3</text>
</g>
</svg>
