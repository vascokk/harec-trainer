<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Half-wave dipole with points P (centre), R (halfway) and Q (end)</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111" stroke="none"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<line x1="60" y1="120" x2="296" y2="120" stroke-width="4"/><line x1="304" y1="120" x2="540" y2="120" stroke-width="4"/><circle cx="296" cy="120" r="3.5" fill="#111"/><circle cx="304" cy="120" r="3.5" fill="#111"/><line x1="296" y1="120" x2="296" y2="200" /><line x1="304" y1="120" x2="304" y2="200" /><text x="300" y="222" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">feeder</text><circle cx="300" cy="120" r="6" fill="#c01c28" stroke="none"/><text x="300" y="100" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="bold">P</text><circle cx="180" cy="120" r="6" fill="#c01c28" stroke="none"/><text x="180" y="100" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="bold">R</text><circle cx="60" cy="120" r="6" fill="#c01c28" stroke="none"/><text x="60" y="100" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="bold">Q</text><text x="300" y="40" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="bold">Resonant half-wave dipole</text>
</g>
</svg>
