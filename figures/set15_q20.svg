<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<rect x="70" y="80" width="120" height="54" rx="4" fill="#fff"/><text x="130.0" y="104.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Band-pass</text><text x="130.0" y="120.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">filter</text><rect x="220" y="80" width="120" height="54" rx="4" fill="#fff"/><text x="280.0" y="112.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="bold">X</text><line x1="190" y1="107.0" x2="220" y2="107.0" marker-end="url(#arr)"/><rect x="370" y="80" width="120" height="54" rx="4" fill="#fff"/><text x="430.0" y="104.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">DSP</text><text x="430.0" y="120.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">(computer/FPGA)</text><line x1="340" y1="107.0" x2="370" y2="107.0" marker-end="url(#arr)"/><rect x="520" y="80" width="120" height="54" rx="4" fill="#fff"/><text x="580.0" y="112.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">DAC</text><line x1="490" y1="107.0" x2="520" y2="107.0" marker-end="url(#arr)"/><rect x="670" y="80" width="120" height="54" rx="4" fill="#fff"/><text x="730.0" y="104.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">AF</text><text x="730.0" y="120.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">amplifier</text><line x1="640" y1="107.0" x2="670" y2="107.0" marker-end="url(#arr)"/><line x1="40" y1="107" x2="40" y2="73" /><line x1="40" y1="73" x2="29" y2="57" /><line x1="40" y1="73" x2="51" y2="57" /><line x1="40" y1="73" x2="40" y2="57" /><line x1="40" y1="107" x2="70" y2="107" marker-end="url(#arr)"/><line x1="820" y1="107" x2="860" y2="107" marker-end="url(#arr)"/><text x="866" y="112" text-anchor="start" fill="#111" stroke="none" font-size="14" font-weight="normal">Loudspeaker</text>
