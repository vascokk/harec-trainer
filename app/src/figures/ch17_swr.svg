<svg xmlns="http://www.w3.org/2000/svg" width="490" height="170" viewBox="0 0 490 170" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>SWR and power meter readings: forward 120 W, reflected 20 W</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111" stroke="none"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="30" width="200" height="110" rx="8" fill="#fff"/><text x="130" y="70" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">FORWARD</text><text x="130" y="110" text-anchor="middle" fill="#111" stroke="none" font-size="26" font-weight="bold">120 W</text><rect x="260" y="30" width="200" height="110" rx="8" fill="#fff"/><text x="360" y="70" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">REFLECTED</text><text x="360" y="110" text-anchor="middle" fill="#111" stroke="none" font-size="26" font-weight="bold">20 W</text>
</g>
</svg>
