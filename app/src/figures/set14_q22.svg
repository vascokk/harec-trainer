<svg xmlns="http://www.w3.org/2000/svg" width="520" height="310" viewBox="0 0 520 310" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Cross-section of coaxial cable with dimensions D and d</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111" stroke="none"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<circle cx="200" cy="170" r="120" fill="#555"/><circle cx="200" cy="170" r="104" fill="#c9a227" stroke="none"/><circle cx="200" cy="170" r="96" fill="#e8f0fb"/><circle cx="200" cy="170" r="20" fill="#c9a227"/><line x1="180" y1="170" x2="220" y2="170" marker-end="url(#arr)" marker-start="url(#arr)" stroke-width="1.5"/><text x="200" y="205" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="bold">d</text><line x1="104" y1="260" x2="296" y2="260" marker-end="url(#arr)" marker-start="url(#arr)" stroke-width="1.5"/><text x="200" y="255" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="bold">D</text><line x1="104" y1="230" x2="104" y2="270" stroke-width="1" stroke-dasharray="3,3"/><line x1="296" y1="230" x2="296" y2="270" stroke-width="1" stroke-dasharray="3,3"/><text x="340" y="60" text-anchor="start" fill="#111" stroke="none" font-size="13" font-weight="normal">outer jacket</text><line x1="338" y1="56" x2="300" y2="90" stroke-width="1"/><text x="340" y="120" text-anchor="start" fill="#111" stroke="none" font-size="13" font-weight="normal">braid (outer conductor)</text><line x1="338" y1="116" x2="296" y2="140" stroke-width="1"/><text x="340" y="180" text-anchor="start" fill="#111" stroke="none" font-size="13" font-weight="normal">dielectric</text><line x1="338" y1="176" x2="260" y2="176" stroke-width="1"/><text x="200" y="140" text-anchor="middle" fill="#111" stroke="none" font-size="12" font-weight="normal">inner conductor</text>
</g>
</svg>
