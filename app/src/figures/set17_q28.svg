<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Two antennas of heights h1 and h2 over the curved Earth with a line-of-sight path</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111" stroke="none"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M20,260 Q300,160 580,260" stroke-width="3"/><text x="300" y="250" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Earth</text><line x1="90" y1="228" x2="90" y2="120" stroke-width="4"/><line x1="510" y1="228" x2="510" y2="140" stroke-width="4"/><line x1="90" y1="120" x2="510" y2="140" stroke="#1a5fb4" stroke-dasharray="8,5"/><text x="300" y="118" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">line of sight</text><text x="76" y="175" text-anchor="end" fill="#111" stroke="none" font-size="14" font-weight="bold">h1</text><text x="524" y="185" text-anchor="start" fill="#111" stroke="none" font-size="14" font-weight="bold">h2</text>
</g>
</svg>
