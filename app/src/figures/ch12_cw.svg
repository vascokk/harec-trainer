<svg xmlns="http://www.w3.org/2000/svg" width="780" height="230" viewBox="0 0 780 230" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>CW transmitter: master oscillator, stage X, power amplifier, low-pass filter; key on the power amplifier</title>
