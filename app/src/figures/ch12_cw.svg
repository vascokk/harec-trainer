<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="60" width="120" height="60" rx="4" fill="#fff"/><text x="90.0" y="87.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Master</text><text x="90.0" y="103.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">oscillator</text><rect x="190" y="60" width="120" height="60" rx="4" fill="#fff"/><text x="250.0" y="95.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="bold">X</text><line x1="150" y1="90.0" x2="190" y2="90.0" marker-end="url(#arr)"/><rect x="350" y="60" width="120" height="60" rx="4" fill="#fff"/><text x="410.0" y="87.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Power</text><text x="410.0" y="103.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">amplifier</text><line x1="310" y1="90.0" x2="350" y2="90.0" marker-end="url(#arr)"/><rect x="510" y="60" width="120" height="60" rx="4" fill="#fff"/><text x="570.0" y="87.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Low-pass</text><text x="570.0" y="103.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">filter</text><line x1="470" y1="90.0" x2="510" y2="90.0" marker-end="url(#arr)"/><line x1="670" y1="90" x2="710" y2="90" marker-end="url(#arr)"/><line x1="720" y1="90" x2="720" y2="56" /><line x1="720" y1="56" x2="709" y2="40" /><line x1="720" y1="56" x2="731" y2="40" /><line x1="720" y1="56" x2="720" y2="40" /><rect x="350" y="170" width="120" height="40" rx="4" fill="#fff"/><text x="410.0" y="195.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Morse key</text><line x1="410" y1="170" x2="410" y2="120" />
