<circle cx="40" cy="80" r="4" fill="#fff"/><text x="40" y="64" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="bold">A</text><line x1="44" y1="80" x2="98.0" y2="80" /><line x1="98.0" y1="66" x2="98.0" y2="94" /><line x1="106.0" y1="66" x2="106.0" y2="94" /><line x1="106.0" y1="80" x2="160" y2="80" /><text x="102" y="52" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="normal">100 pF</text><line x1="160" y1="80" x2="214.0" y2="80" /><line x1="214.0" y1="66" x2="214.0" y2="94" /><line x1="222.0" y1="66" x2="222.0" y2="94" /><line x1="222.0" y1="80" x2="276" y2="80" /><text x="218" y="52" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="normal">100 pF</text><circle cx="280" cy="80" r="4" fill="#fff"/><text x="280" y="64" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="bold">B</text>
</g>
