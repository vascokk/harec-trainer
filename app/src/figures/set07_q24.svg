<svg xmlns="http://www.w3.org/2000/svg" width="650" height="170" viewBox="0 0 650 170" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Transmitter 50 W, feeder loss 3 dB, antenna gain 6 dBd</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111" stroke="none"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="70" width="150" height="60" rx="4" fill="#fff"/><text x="105.0" y="97.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Transmitter</text><text x="105.0" y="113.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">50 W (17 dBW)</text><rect x="220" y="70" width="150" height="60" rx="4" fill="#fff"/><text x="295.0" y="97.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Feeder</text><text x="295.0" y="113.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">loss 3 dB</text><line x1="180" y1="100.0" x2="220" y2="100.0" marker-end="url(#arr)"/><rect x="410" y="70" width="150" height="60" rx="4" fill="#fff"/><text x="485.0" y="97.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Antenna</text><text x="485.0" y="113.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">gain 6 dBd</text><line x1="370" y1="100.0" x2="410" y2="100.0" marker-end="url(#arr)"/><line x1="560" y1="100" x2="600" y2="100" marker-end="url(#arr)"/><line x1="600" y1="100" x2="600" y2="66" /><line x1="600" y1="66" x2="589" y2="50" /><line x1="600" y1="66" x2="611" y2="50" /><line x1="600" y1="66" x2="600" y2="50" />
