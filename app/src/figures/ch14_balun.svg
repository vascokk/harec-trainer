<svg xmlns="http://www.w3.org/2000/svg" width="420" height="290" viewBox="0 0 420 290" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Half-wave dipole connected through unit X to 50 ohm coaxial cable</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111" stroke="none"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<line x1="60" y1="60" x2="200" y2="60" /><line x1="220" y1="60" x2="360" y2="60" /><text x="210" y="40" text-anchor="middle" fill="#111" stroke="none" font-size="14" font-weight="normal">Half-wave dipole</text><line x1="200" y1="60" x2="200" y2="110" /><line x1="220" y1="60" x2="220" y2="110" /><rect x="160" y="110" width="100" height="50" rx="4" fill="#fff"/><text x="210.0" y="140.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="bold">X</text><line x1="210" y1="160" x2="210" y2="230" /><text x="222" y="200" text-anchor="start" fill="#111" stroke="none" font-size="14" font-weight="normal">50 Ω coax</text><rect x="160" y="230" width="100" height="40" rx="4" fill="#fff"/><text x="210.0" y="255.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Transceiver</text>
</g>
</svg>
