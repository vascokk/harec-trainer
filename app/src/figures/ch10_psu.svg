<svg xmlns="http://www.w3.org/2000/svg" width="820" height="140" viewBox="0 0 820 140" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Power supply: transformer, block X, smoothing capacitor, voltage regulator</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111" stroke="none"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<rect x="70" y="50" width="120" height="60" rx="4" fill="#fff"/><text x="130.0" y="85.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Transformer</text><rect x="230" y="50" width="120" height="60" rx="4" fill="#fff"/><text x="290.0" y="85.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="bold">X</text><line x1="190" y1="80.0" x2="230" y2="80.0" marker-end="url(#arr)"/><rect x="390" y="50" width="120" height="60" rx="4" fill="#fff"/><text x="450.0" y="77.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Smoothing</text><text x="450.0" y="93.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">capacitor</text><line x1="350" y1="80.0" x2="390" y2="80.0" marker-end="url(#arr)"/><rect x="550" y="50" width="120" height="60" rx="4" fill="#fff"/><text x="610.0" y="77.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Voltage</text><text x="610.0" y="93.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">regulator</text><line x1="510" y1="80.0" x2="550" y2="80.0" marker-end="url(#arr)"/><text x="35" y="76" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">230 V</text><text x="35" y="92" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">AC</text><line x1="670" y1="80" x2="710" y2="80" marker-end="url(#arr)"/><text x="718" y="85" text-anchor="start" fill="#111" stroke="none" font-size="14" font-weight="normal">13.8 V DC</text>
