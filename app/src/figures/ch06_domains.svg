<svg xmlns="http://www.w3.org/2000/svg" width="620" height="270" viewBox="0 0 620 270" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Plot with frequency on the horizontal axis: lines at 1 Hz and 6 Hz</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111" stroke="none"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<line x1="40" y1="230" x2="580" y2="230" marker-end="url(#arr)"/><line x1="40" y1="230" x2="40" y2="30" marker-end="url(#arr)"/><text x="580" y="252" text-anchor="end" fill="#111" stroke="none" font-size="13" font-weight="normal">frequency</text><text x="32" y="24" text-anchor="start" fill="#111" stroke="none" font-size="13" font-weight="normal">amplitude</text><line x1="107.5" y1="230" x2="107.5" y2="70.0" stroke="#1a5fb4" stroke-width="4"/><text x="107.5" y="252" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">1 Hz</text><line x1="445.0" y1="230" x2="445.0" y2="150.0" stroke="#1a5fb4" stroke-width="4"/><text x="445.0" y="252" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">6 Hz</text>
</g>
</svg>
