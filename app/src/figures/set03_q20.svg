<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>CW transmitter block diagram with stage X after the VFO</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111" stroke="none"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<rect x="30" y="80" width="100" height="54" rx="4" fill="#fff"/><text x="80.0" y="112.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">VFO</text><rect x="160" y="80" width="100" height="54" rx="4" fill="#fff"/><text x="210.0" y="112.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="bold">X</text><line x1="130" y1="107.0" x2="160" y2="107.0" marker-end="url(#arr)"/><rect x="290" y="80" width="100" height="54" rx="4" fill="#fff"/><text x="340.0" y="112.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Driver</text><line x1="260" y1="107.0" x2="290" y2="107.0" marker-end="url(#arr)"/><rect x="420" y="80" width="100" height="54" rx="4" fill="#fff"/><text x="470.0" y="104.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Power</text><text x="470.0" y="120.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">amplifier</text><line x1="390" y1="107.0" x2="420" y2="107.0" marker-end="url(#arr)"/><rect x="550" y="80" width="100" height="54" rx="4" fill="#fff"/><text x="600.0" y="104.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Low-pass</text><text x="600.0" y="120.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">filter</text><line x1="520" y1="107.0" x2="550" y2="107.0" marker-end="url(#arr)"/><line x1="650" y1="107" x2="700" y2="107" marker-end="url(#arr)"/><line x1="700" y1="107" x2="700" y2="73" /><line x1="700" y1="73" x2="689" y2="57" /><line x1="700" y1="73" x2="711" y2="57" /><line x1="700" y1="73" x2="700" y2="57" /><rect x="290" y="190" width="100" height="40" rx="4" fill="#fff"/><text x="340.0" y="215.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Morse key</text><line x1="340" y1="190" x2="340" y2="134" />
