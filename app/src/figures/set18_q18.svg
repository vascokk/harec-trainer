<rect width="100%" height="100%" fill="#fff"/>
<g stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<rect x="70" y="80" width="120" height="54" rx="4" fill="#fff"/><text x="130.0" y="104.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">RF amplifier</text><text x="130.0" y="120.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">7.1 MHz</text><rect x="220" y="80" width="120" height="54" rx="4" fill="#fff"/><text x="280.0" y="112.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Mixer</text><line x1="190" y1="107.0" x2="220" y2="107.0" marker-end="url(#arr)"/><rect x="370" y="80" width="120" height="54" rx="4" fill="#fff"/><text x="430.0" y="104.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">IF filter</text><text x="430.0" y="120.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">9 MHz</text><line x1="340" y1="107.0" x2="370" y2="107.0" marker-end="url(#arr)"/><rect x="520" y="80" width="120" height="54" rx="4" fill="#fff"/><text x="580.0" y="112.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Detector</text><line x1="490" y1="107.0" x2="520" y2="107.0" marker-end="url(#arr)"/><line x1="40" y1="107" x2="40" y2="73" /><line x1="40" y1="73" x2="29" y2="57" /><line x1="40" y1="73" x2="51" y2="57" /><line x1="40" y1="73" x2="40" y2="57" /><line x1="40" y1="107" x2="70" y2="107" marker-end="url(#arr)"/><rect x="220" y="190" width="120" height="50" rx="4" fill="#fff"/><text x="280.0" y="212.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">Local oscillator</text><text x="280.0" y="228.0" text-anchor="middle" fill="#111" stroke="none" font-size="13" font-weight="normal">16.1 MHz</text><line x1="280" y1="190" x2="280" y2="134" marker-end="url(#arr)"/>
