<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>Receiver tuned to 7.1 MHz, LO 16.1 MHz, IF 9 MHz</title>
