<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <ellipse cx="118" cy="190" rx="50" ry="6" fill="#000" opacity=".12"/>
  <!-- speech bubble -->
  <path d="M10 22 h66 a10 10 0 0 1 10 10 v18 a10 10 0 0 1 -10 10 h-30 l-6 12 l-4 -12 h-26 a10 10 0 0 1 -10 -10 v-18 a10 10 0 0 1 10 -10z" fill="#fff" stroke="#2e2118" stroke-width="2.5"/>
  <text x="43" y="47" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-weight="700" font-size="17" fill="#2e2118">CQ CQ</text>
  <!-- ears -->
  <rect x="100" y="8" width="18" height="82" rx="9" fill="#b97a47"/>
  <rect x="126" y="8" width="18" height="82" rx="9" fill="#b97a47"/>
  <rect x="105" y="18" width="8" height="64" rx="4" fill="#f0a6a6"/>
  <rect x="131" y="18" width="8" height="64" rx="4" fill="#f0a6a6"/>
  <!-- yagi elements through ears -->
  <g stroke="#8d98a5" stroke-width="3.5" stroke-linecap="round">
    <line x1="96" y1="22" x2="148" y2="22"/>
    <line x1="92" y1="40" x2="152" y2="40"/>
    <line x1="88" y1="58" x2="156" y2="58"/>
  </g>
  <g fill="#8d98a5"><circle cx="109" cy="22" r="3"/><circle cx="135" cy="22" r="3"/><circle cx="109" cy="40" r="3"/><circle cx="135" cy="40" r="3"/><circle cx="109" cy="58" r="3"/><circle cx="135" cy="58" r="3"/></g>
  <!-- radio waves -->
  <g fill="none" stroke="#169b62" stroke-width="3" stroke-linecap="round">
    <path d="M158 12 q8 10 0 20"/><path d="M168 6 q13 16 0 32"/><path d="M178 0 q18 22 0 44" opacity=".5"/>
  </g>
  <!-- body -->
  <ellipse cx="122" cy="160" rx="40" ry="32" fill="#b97a47"/>
  <ellipse cx="122" cy="166" rx="24" ry="22" fill="#f3e2c4"/>
  <ellipse cx="100" cy="188" rx="15" ry="6" fill="#8a5530"/>
  <ellipse cx="144" cy="188" rx="15" ry="6" fill="#8a5530"/>
  <!-- head -->
  <ellipse cx="122" cy="112" rx="38" ry="32" fill="#b97a47"/>
  <ellipse cx="122" cy="125" rx="21" ry="14" fill="#f3e2c4"/>
  <!-- eyes: one wide, one squint (proud) -->
  <circle cx="108" cy="108" r="7" fill="#fff" stroke="#2e2118" stroke-width="2"/><circle cx="110" cy="108" r="3.5" fill="#2e2118"/>
  <path d="M128 108 q7 -6 14 0" fill="none" stroke="#2e2118" stroke-width="3" stroke-linecap="round"/>
  <path d="M117 118 Q122 115 127 118 Q122 123 117 118Z" fill="#d9707a"/>
  <path d="M110 126 Q122 138 136 124" fill="none" stroke="#2e2118" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="122" y="128" width="7" height="6" rx="1" fill="#fff" stroke="#2e2118" stroke-width="1.2"/>
  <!-- hand mic -->
  <path d="M70 140 q-10 18 8 30" fill="none" stroke="#2e2118" stroke-width="2.5"/>
  <rect x="78" y="132" width="16" height="24" rx="7" fill="#2e2118"/>
  <ellipse cx="90" cy="146" rx="9" ry="7" fill="#b97a47"/>
</svg>
