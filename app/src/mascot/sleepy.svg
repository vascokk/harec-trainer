    <g opacity=".35" transform="translate(118 -18) scale(.6)"><rect x="100" y="52" width="14" height="6" rx="3"/><rect x="118" y="52" width="14" height="6" rx="3"/><circle cx="139" cy="55" r="3.5"/><circle cx="149" cy="55" r="3.5"/></g>
