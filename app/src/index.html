<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAREC Trainer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" data-go="home" aria-label="Home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="3.2" fill="currentColor"/>
        <path d="M10.3 21.7a8 8 0 0 1 0-11.4M21.7 10.3a8 8 0 0 1 0 11.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M6.1 25.9a14 14 0 0 1 0-19.8M25.9 6.1a14 14 0 0 1 0 19.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".55"/>
      </svg>
      <span>HAREC <b>Trainer</b></span>
    </button>
    <div class="topbar-right">
      <span id="topbar-status"></span>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle colour theme" title="Toggle theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>
  <main id="app"></main>
  <div id="modal-root"></div>
  <script src="data/questions.js"></script>
  <script src="morse.js"></script>
  <script src="app.js"></script>
</body>
</html>
