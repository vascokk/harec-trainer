[package]
name = "harec-trainer"
version = "0.1.0"
description = "HAREC exam trainer"
edition = "2021"

[lib]
name = "harec_trainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
